# ros_gz_bridge: Gazebo -> ROS 2 (dipakai run_ros_bridge.sh)
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
# RealSense D435 (models/realsense_d435), frame_id d435_link
- ros_topic_name: /d435/image
  gz_topic_name: /d435/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /d435/depth_image
  gz_topic_name: /d435/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /d435/camera_info
  gz_topic_name: /d435/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
